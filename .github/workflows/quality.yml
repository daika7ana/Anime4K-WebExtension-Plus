name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 23
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm exec vitest run --coverage

      - name: Build extensions
        run: pnpm build:chrome && pnpm build:firefox

      - name: Check production bundle
        run: pnpm run check:bundle

      - name: Check version consistency
        run: pnpm run check:version

      - name: Install Chromium for WGSL verification
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify WGSL compilation
        run: pnpm run verify:wgsl

      - name: Verify GPU effect correctness
        run: pnpm test:gpu
